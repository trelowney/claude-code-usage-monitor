name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_ASSET_NAME: claude-usage-monitor-trelowney.exe
  # Plain log output, so warnings can't hide behind ANSI escape codes.
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Test updater safeguards
        run: cargo test --locked updater

      - name: Build release binary
        run: cargo build --release --locked

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "trelowney's Claude Usage Monitor ${{ github.ref_name }}"
          files: target/release/claude-usage-monitor-trelowney.exe
          generate_release_notes: true
