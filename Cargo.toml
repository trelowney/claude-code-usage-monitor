[package]
name = "claude-usage-monitor-trelowney"
version = "1.4.9-trelowney.2"
edition = "2021"
license = "MIT"
description = "Claude Code Usage Monitor - trelowney's private build"
repository = "https://github.com/trelowney/claude-code-usage-monitor"

[package.metadata.winres]
CompanyName = "trelowney"
ProductName = "Claude Usage Monitor (trelowney's build)"
FileDescription = "Claude Usage Monitor (trelowney's build)"
OriginalFilename = "claude-usage-monitor-trelowney.exe"
InternalName = "ClaudeUsageMonitorTrelowney"
Comments = "https://github.com/trelowney/claude-code-usage-monitor"
LegalCopyright = "Copyright (C) 2026 Code Zeno Pty Ltd. Modified by trelowney."

[dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "json", "proxy-from-env"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Data_Xml_Dom",
    "UI_Notifications",
]

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
